name: lint-every-pr
on:
  pull_request:
    branches:
      - main
jobs:
  lint:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v7
     - name: Run ruff check
       uses: astral-sh/ruff-action@v4.0.0
       with:
         version: "<0.16"
     - name: Run ruff format
       run: ruff format --check
